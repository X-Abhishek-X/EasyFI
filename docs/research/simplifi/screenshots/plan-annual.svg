<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" role="img" aria-labelledby="title desc">
  <title id="title">Annual plan - save 15%</title>
  <desc id="desc">A blue-lagoon 12-month calendar card with a 15% SAVE badge for the annual subscription.</desc>

  <defs>
    <linearGradient id="yrBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a4e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="yrTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#56E6CA"/>
      <stop offset="100%" stop-color="#20B596"/>
    </linearGradient>
    <filter id="yrShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#06111F" flood-opacity=".28"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="250" rx="110" ry="14" fill="#0A1730" opacity=".34"/>

  <!-- framing arcs -->
  <path d="M40 150 A130 130 0 0 1 200 40" fill="none" stroke="#45E1BD" stroke-width="10" stroke-linecap="round" opacity=".9"/>
  <circle cx="40" cy="150" r="8" fill="#45E1BD"/>
  <path d="M90 230 A120 100 0 0 0 280 180" fill="none" stroke="#2F7CF6" stroke-width="10" stroke-linecap="round" opacity=".85"/>

  <g filter="url(#yrShadow)">
    <rect x="70" y="55" width="180" height="160" rx="28" fill="url(#yrBody)" stroke="#2B527C" stroke-width="2"/>
    <rect x="70" y="55" width="180" height="28" rx="28" fill="#1E3A5F" opacity=".7"/>
    <rect x="70" y="69" width="180" height="14" fill="#1E3A5F" opacity=".7"/>
    <rect x="118" y="44" width="14" height="24" rx="7" fill="#6DDCFF"/>
    <rect x="188" y="44" width="14" height="24" rx="7" fill="#6DDCFF"/>

    <text x="160" y="145" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF">12</text>
    <text x="160" y="175" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="2.5" fill="#D4DCE8">MONTHS</text>

    <circle cx="98" cy="138" r="5" fill="#4D84FF"/>
    <circle cx="112" cy="138" r="5" fill="#6DDCFF"/>
    <circle cx="126" cy="138" r="5" fill="#45E1BD"/>
    <circle cx="194" cy="138" r="5" fill="#9274F6"/>
    <circle cx="208" cy="138" r="5" fill="#45E1BD"/>
    <circle cx="222" cy="138" r="5" fill="#6DDCFF"/>
  </g>

  <!-- save badge -->
  <polygon points="248,70 290,88 248,106" fill="#45E1BD" opacity=".45"/>
  <g transform="translate(252 78)" filter="url(#yrShadow)">
    <circle r="36" fill="url(#yrTeal)" stroke="#FFFFFF" stroke-width="3"/>
    <text y="-4" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">15%</text>
    <text y="14" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="#FFFFFF">SAVE</text>
  </g>

  <path d="M55 210 L60 220 L70 225 L60 230 L55 240 L50 230 L40 225 L50 220 Z" fill="#9274F6"/>
  <circle cx="280" cy="220" r="7" fill="#9274F6"/>
</svg>
